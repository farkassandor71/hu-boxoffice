name: Update box office data

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC; the source posts monthly between the 1st-10th
  workflow_dispatch:
    inputs:
      full:
        description: "Full rebuild from every archived snapshot (only needed after a parser change)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install xlrd==2.0.2 certifi

      # Incremental mode (default) merges only the snapshot(s) not yet reflected
      # in the checked-out data/films.json, so this run only downloads the new
      # month's .xls — no persistent cache of the whole archive is needed.
      - name: Build films.json
        run: python pipeline/build.py ${{ inputs.full && '--full' || '' }}

      - name: Commit if data changed
        run: |
          git config user.name "boxoffice-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/films.json; then
            git add data/films.json data/conflicts.log
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No change in films.json"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data          # publishes data/films.json at <pages-url>/films.json
      - uses: actions/deploy-pages@v4
